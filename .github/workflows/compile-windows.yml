name: Pujjo source-only Windows compile
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Portable regression suite
        run: python3 tests/run_offline_suite.py --logs build-logs/offline
      - name: Compiler, sanitizer and static analyzer matrix
        run: python3 tests/run_compiler_matrix.py
      - name: Verify real pinned ADL-N firmware manifest and audio module budgets
        run: |
          firmware="$RUNNER_TEMP/sof-adl-n.ri"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            'https://raw.githubusercontent.com/thesofproject/sof-bin/fcd5ae85ead7ecd67ff199335b61fac825843ca0/v2.12.x/sof-ipc4-v2.12/adl-n/intel-signed/sof-adl-n.ri' \
            --output "$firmware"
          python3 tests/verify_pinned_adln_firmware.py "$firmware" build-logs/firmware-candidate.json
          PUJJO_FIRMWARE_TEST_FILE="$firmware" python3 tests/run_loader_transport_tests.py
      - name: Install ALSA encoder build dependency
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libasound2-dev
      - name: Cross-check SSP candidates against pinned upstream ALSA
        run: |
          upstream="$RUNNER_TEMP/alsa-utils-ssp"
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/alsa-project/alsa-utils.git
          git -C "$upstream" fetch --depth=1 origin f04b9e0f1285fe25d4146906c5a8511741b8abad
          git -C "$upstream" checkout --detach FETCH_HEAD
          bash scripts/run_alsa_ssp_reference.sh "$upstream" build-logs/ssp-reference
      - name: Preserve portable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-results
          path: |
            build-logs/
            validation-v0.0.17/matrix/
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    env:
      CC: clang
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare log directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force build-logs | Out-Null
      - name: Setup Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
      - name: Provision Visual Studio 2022 WDK integration on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'VS 2022 not found' }
          $component = 'Component.Microsoft.Windows.DriverKit'
          if ($vs -match 'BuildTools') { $component += '.BuildTools' }
          $installed = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires $component -property installationPath
          if (!$installed) {
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            $arguments = "modify --installPath `"$vs`" --add $component --quiet --norestart"
            $proc = Start-Process $setup -ArgumentList $arguments -Wait -PassThru
            "VS installer exit: $($proc.ExitCode)" | Out-File build-logs/vs-install.log
            if ($proc.ExitCode -notin @(0,3010)) { throw "VS WDK component setup failed: $($proc.ExitCode)" }
          }
      - name: Install matching Microsoft SDK and WDK on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build-logs/kit-install.log
          try {
            # Microsoft Other WDK Downloads, VS2022 / 26100.6584 row.
            $kits = @(
              @{ Name='sdk'; Url='https://go.microsoft.com/fwlink/?linkid=2338977' },
              @{ Name='wdk'; Url='https://go.microsoft.com/fwlink/?linkid=2335869' }
            )
            foreach ($kit in $kits) {
              $installer = Join-Path $env:RUNNER_TEMP ($kit.Name + 'setup.exe')
              Invoke-WebRequest -Uri $kit.Url -OutFile $installer
              $sig = Get-AuthenticodeSignature $installer
              if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
                throw 'Kit installer Microsoft signature validation failed'
              }
              $proc = Start-Process $installer -ArgumentList '/quiet /norestart /features +' -Wait -PassThru
              if ($proc.ExitCode -notin @(0,3010)) { throw "Kit installer exit code $($proc.ExitCode)" }
            }
            $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
            foreach ($relative in @('Include\10.0.26100.0\km\ntddk.h', 'Include\10.0.26100.0\um\Windows.h', 'Lib\10.0.26100.0\km\x64\ntoskrnl.lib')) {
              if (!(Test-Path (Join-Path $kitRoot $relative))) { throw "Missing SDK/WDK file: $relative" }
            }
          } finally { Stop-Transcript }
      - name: Verify driver toolset after kit installation
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath
          $toolsets = Get-ChildItem "$vs\MSBuild\Microsoft\VC" -Recurse -Filter Toolset.props |
            Where-Object { $_.FullName -match 'WindowsKernelModeDriver10.0' }
          $toolsets.FullName | Out-File build-logs/wdk-toolsets.txt
          if (!$toolsets) { throw 'WindowsKernelModeDriver10.0 integration missing after setup' }
      - name: Compile source prototypes only
        shell: pwsh
        run: |
          msbuild sof_windows_driver.sln /m /t:Rebuild /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:TargetPlatformVersion=10.0.26100.0 /p:WindowsTargetPlatformVersion=10.0.26100.0 /v:normal /bl:build-logs/msbuild.binlog /fl '/flp:LogFile=build-logs/msbuild.log;Verbosity=normal'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build guarded drivers in isolated directories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($case in @(
            @{ Project='sof_dsp'; Defines='/DPUJJO_ENABLE_EXPERIMENTAL_DSP_BOOT /DPUJJO_EXPLICIT_IPC4_FIRMWARE_REVIEWED /DPUJJO_ENABLE_EXPERIMENTAL_AUDIO /DPUJJO_ENABLE_EXPERIMENTAL_ANALOG' },
            @{ Project='sof_dsp'; Defines='/DPUJJO_ENABLE_EXPERIMENTAL_DSP_BOOT /DPUJJO_EXPLICIT_IPC4_FIRMWARE_REVIEWED /DPUJJO_DSP_BOOT_DIAGNOSTIC'; Name='dsp-boot-only' },
            @{ Project='sof_dsp'; Defines='/DPUJJO_ENABLE_EXPERIMENTAL_DSP_BOOT /DPUJJO_EXPLICIT_IPC4_FIRMWARE_REVIEWED /DPUJJO_ENABLE_EXPERIMENTAL_AUDIO /DPUJJO_DMIC_ENUMERATION_CANDIDATE'; Name='dmic-enumeration-compile-only' },
            @{ Project='sof_dsp'; Defines='/DPUJJO_ENABLE_EXPERIMENTAL_DSP_BOOT /DPUJJO_EXPLICIT_IPC4_FIRMWARE_REVIEWED /DPUJJO_DSP_BOOT_DIAGNOSTIC /DPUJJO_DMIC_DETECTION_TEST'; Name='dmic-detection-parent' },
            @{ Project='sof_dsp'; Defines='/DPUJJO_ENABLE_EXPERIMENTAL_DSP_BOOT /DPUJJO_EXPLICIT_IPC4_FIRMWARE_REVIEWED /DPUJJO_DSP_BOOT_DIAGNOSTIC /DPUJJO_DMIC_DMA_PREFLIGHT'; Name='dmic-dma-preflight' },
            @{ Project='pujjo_audio'; Defines='/DPUJJO_DMIC_DETECTION_TEST_ADAPTER'; Name='dmic-detection-child' },
            @{ Project='pujjo_rt5682_probe'; Defines='/DPJ5682S_ENABLE_READONLY_PROBE'; Name='codec-identity' },
            @{ Project='pujjo_rt5682_probe'; Defines='/DPJ5682S_ENABLE_CONTROL'; Name='codec-runtime' },
            @{ Project='pujjo_rt1019_probe'; Defines='/DPJ1019_ENABLE_CONTROL'; Name='amp-runtime' }
          )) {
            $env:CL = $case.Defines
            $variant = if ($case.Name) { $case.Name } else { $case.Project }
            $isolated = Join-Path $env:RUNNER_TEMP ("guarded-" + $variant)
            $intermediate = if ($case.Project -eq 'sof_dsp') {
              "/p:SolutionDir=$isolated/"
            } else {
              "/p:IntDir=$isolated/obj/"
            }
            msbuild "$($case.Project).vcxproj" /t:Rebuild /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 $intermediate "/p:OutDir=$isolated/bin/" /p:TargetPlatformVersion=10.0.26100.0 /p:WindowsTargetPlatformVersion=10.0.26100.0 /v:minimal /fl "/flp:LogFile=build-logs/guarded-$variant.log;Verbosity=normal"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (!(Test-Path "$isolated/bin/$($case.Project).sys")) { throw "Missing guarded driver $variant" }
            $objects = Join-Path $isolated 'obj'
            if ($case.Project -eq 'sof_dsp') {
              foreach ($object in @('PujjoAudioBus.obj', 'WaveRt.obj', 'PujjoAnalog.obj', 'PujjoDmicDetection.obj')) {
                if (!(Get-ChildItem $objects -Filter $object -Recurse)) { throw "Missing guarded object $object" }
              }
            }
          }
      - name: Verify all expected unsigned development products
        shell: pwsh
        run: |
          $output = 'bin/x64/${{ matrix.configuration }}'
          foreach ($name in @('sof_core.lib', 'sof_dsp.sys', 'pujjo_audio.sys', 'pujjo_rt5682_probe.sys', 'pujjo_rt1019_probe.sys')) {
            $file = Join-Path $output $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing build product: $file" }
            Get-FileHash $file -Algorithm SHA256 | Format-List | Out-File build-logs/products.txt -Append
            if ($file.EndsWith('.sys')) {
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne 'NotSigned') { throw "Expected unsigned development binary: $file" }
            }
          }
          'NOT INSTALLABLE - NOT HARDWARE VERIFIED. Unsigned compile-only development products.' | Set-Content "$output/NOT-INSTALLABLE.txt"
      - name: Validate PortCls endpoint INF without staging it
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $tool = @(
            (Join-Path $kitRoot 'Tools\10.0.26100.0\x64\InfVerif.exe')
            (Join-Path $kitRoot 'bin\10.0.26100.0\x64\InfVerif.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (!$tool) { throw 'Missing InfVerif from WDK 10.0.26100.0' }
          $scratch = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/portcls-inf"
          $inf = Join-Path $scratch.FullName 'pujjo_audio.inf'
          Copy-Item src/driver/pujjo_audio.inx $inf
          Copy-Item bin/x64/Release/pujjo_audio.sys $scratch.FullName
          & $tool /w /v $inf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify read-only diagnostic INFs and generate unsigned catalogs
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          ./scripts/Stage-PujjoDiagnosticPackage.ps1 -BinaryDirectory bin/x64/Release -OutputDirectory "$env:RUNNER_TEMP/pujjo-diagnostics" -SourceRevision $revision
      - name: Verify separate codec identity diagnostic
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = (git rev-parse HEAD).Trim()
          ./scripts/Stage-PujjoDiagnosticPackage.ps1 -BinaryDirectory "$env:RUNNER_TEMP/guarded-codec-identity/bin" -OutputDirectory "$env:RUNNER_TEMP/pujjo-codec-identity" -SourceRevision $revision -CodecIdentity
      - name: Stage separate DSP boot-only submission
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CL = ''
          $revision = (git rev-parse HEAD).Trim()
          ./scripts/Stage-PujjoDspBootDiagnostic.ps1 -BinaryDirectory "$env:RUNNER_TEMP/guarded-dsp-boot-only/bin" -OutputDirectory "$env:RUNNER_TEMP/pujjo-dsp-boot-only" -SourceRevision $revision
      - name: Verify DSP boot-only submission provenance and safety
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = (git rev-parse HEAD).Trim()
          ./scripts/Verify-PujjoDspBootDiagnostic.ps1 -SubmissionDirectory "$env:RUNNER_TEMP/pujjo-dsp-boot-only" -ExpectedRevision $revision
      - name: Exercise local diagnostic verification gates
        if: matrix.configuration == 'Release'
        shell: powershell
        run: ./tests/Test-PujjoLocalDiagnostic.ps1
      - name: Verify DSP submission with Windows PowerShell 5.1
        if: matrix.configuration == 'Release'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = (git rev-parse HEAD).Trim()
          .\scripts\Verify-PujjoDspBootDiagnostic.ps1 -SubmissionDirectory "$env:RUNNER_TEMP/pujjo-dsp-boot-only" -ExpectedRevision $revision
      - name: Upload unsigned DSP boot-only submission input
        if: success() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pujjo-DSP-boot-only-UNSIGNED-SUBMISSION
          path: ${{ runner.temp }}/pujjo-dsp-boot-only/
          if-no-files-found: error
      - name: Upload unsigned codec identity submission input
        if: success() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pujjo-codec-identity-UNSIGNED-SUBMISSION
          path: ${{ runner.temp }}/pujjo-codec-identity/
          if-no-files-found: error
      - name: Upload unsigned diagnostic submission input
        if: success() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pujjo-resource-diagnostics-UNSIGNED-SUBMISSION
          path: ${{ runner.temp }}/pujjo-diagnostics/
          if-no-files-found: error
      - name: Stage and verify unsigned DMIC-only PortCls endpoint review
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('scripts/Stage-PujjoDmicReview.ps1', 'scripts/Verify-PujjoDmicReview.ps1')) {
            $tokenList = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokenList, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ("PowerShell parse error in {0}: {1}" -f $script, $parseErrors[0].Message) }
          }
          $revision = (git rev-parse HEAD).Trim()
          ./scripts/Stage-PujjoDmicReview.ps1 -BinaryDirectory bin/x64/Release -OutputDirectory "$env:RUNNER_TEMP/pujjo-dmic-review" -SourceRevision $revision
          ./scripts/Verify-PujjoDmicReview.ps1 -SubmissionDirectory "$env:RUNNER_TEMP/pujjo-dmic-review" -ExpectedRevision $revision
      - name: Upload unsigned DMIC-only endpoint review
        if: success() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pujjo-DMIC-endpoint-UNSIGNED-REVIEW
          path: ${{ runner.temp }}/pujjo-dmic-review/
          if-no-files-found: error
      - name: Stage and validate separate microphone detection test
        if: matrix.configuration == 'Release'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = (git rev-parse HEAD).Trim()
          ./scripts/Stage-PujjoDmicDetection.ps1 -ParentBinaryDirectory "$env:RUNNER_TEMP/guarded-dmic-detection-parent/bin" -ChildBinaryDirectory "$env:RUNNER_TEMP/guarded-dmic-detection-child/bin" -OutputDirectory "$env:RUNNER_TEMP/pujjo-dmic-detection" -SourceRevision $revision
          ./scripts/Verify-PujjoDmicDetection.ps1 -SubmissionDirectory "$env:RUNNER_TEMP/pujjo-dmic-detection" -ExpectedRevision $revision
      - name: Upload unsigned microphone detection test
        if: success() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pujjo-v0.0.8.1-MIC-DETECTION-UNSIGNED
          path: ${{ runner.temp }}/pujjo-dmic-detection/
          if-no-files-found: error
      - name: Stage separate unsigned DMA admission preflight
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = (git rev-parse HEAD).Trim()
          ./scripts/Stage-PujjoDspBootDiagnostic.ps1 -BinaryDirectory "$env:RUNNER_TEMP/guarded-dmic-dma-preflight/bin" -OutputDirectory "$env:RUNNER_TEMP/pujjo-dmic-dma-preflight" -SourceRevision $revision -DmaPreflight
          ./scripts/Verify-PujjoDspBootDiagnostic.ps1 -SubmissionDirectory "$env:RUNNER_TEMP/pujjo-dmic-dma-preflight" -ExpectedRevision $revision -DmaPreflight
      - name: Verify DMA admission preflight under Windows PowerShell
        if: matrix.configuration == 'Release'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = (git rev-parse HEAD).Trim()
          ./scripts/Verify-PujjoDspBootDiagnostic.ps1 -SubmissionDirectory "$env:RUNNER_TEMP/pujjo-dmic-dma-preflight" -ExpectedRevision $revision -DmaPreflight
      - name: Upload unsigned DMA admission preflight
        if: success() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pujjo-v0.0.9.1-DMA-PREFLIGHT-UNSIGNED
          path: ${{ runner.temp }}/pujjo-dmic-dma-preflight/
          if-no-files-found: error
      - name: Preserve logs even when checks or compilation fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pujjo-${{ matrix.configuration }}-logs
          path: build-logs/
          if-no-files-found: warn
      - name: Upload successful intermediate products; NEVER install
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pujjo-${{ matrix.configuration }}-NOT-INSTALLABLE-NOT-HARDWARE-VERIFIED
          path: |
            bin/x64/${{ matrix.configuration }}/NOT-INSTALLABLE.txt
            bin/x64/${{ matrix.configuration }}/**/*.sys
            bin/x64/${{ matrix.configuration }}/**/*.lib
            bin/x64/${{ matrix.configuration }}/**/*.pdb
          if-no-files-found: error
