name: Pujjo source-only Windows compile
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Portable regression suite
        run: python3 tests/run_offline_suite.py --logs build-logs/offline
      - name: Compiler, sanitizer and static analyzer matrix
        run: python3 tests/run_compiler_matrix.py
      - name: Preserve portable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-results
          path: |
            build-logs/
            validation-v0.0.17/matrix/
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    env:
      CC: clang
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare log directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force build-logs | Out-Null
      - name: Setup Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
      - name: Provision Visual Studio 2022 WDK integration on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'VS 2022 not found' }
          $component = 'Component.Microsoft.Windows.DriverKit'
          if ($vs -match 'BuildTools') { $component += '.BuildTools' }
          $installed = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires $component -property installationPath
          if (!$installed) {
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            $arguments = "modify --installPath `"$vs`" --add $component --quiet --norestart"
            $proc = Start-Process $setup -ArgumentList $arguments -Wait -PassThru
            "VS installer exit: $($proc.ExitCode)" | Out-File build-logs/vs-install.log
            if ($proc.ExitCode -notin @(0,3010)) { throw "VS WDK component setup failed: $($proc.ExitCode)" }
          }
      - name: Install matching Microsoft SDK and WDK on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build-logs/kit-install.log
          try {
            # Microsoft Other WDK Downloads, VS2022 / 26100.6584 row.
            $kits = @(
              @{ Name='sdk'; Url='https://go.microsoft.com/fwlink/?linkid=2338977' },
              @{ Name='wdk'; Url='https://go.microsoft.com/fwlink/?linkid=2335869' }
            )
            foreach ($kit in $kits) {
              $installer = Join-Path $env:RUNNER_TEMP ($kit.Name + 'setup.exe')
              Invoke-WebRequest -Uri $kit.Url -OutFile $installer
              $sig = Get-AuthenticodeSignature $installer
              if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
                throw 'Kit installer Microsoft signature validation failed'
              }
              $proc = Start-Process $installer -ArgumentList '/quiet /norestart /features +' -Wait -PassThru
              if ($proc.ExitCode -notin @(0,3010)) { throw "Kit installer exit code $($proc.ExitCode)" }
            }
            $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
            foreach ($relative in @('Include\10.0.26100.0\km\ntddk.h', 'Include\10.0.26100.0\um\Windows.h', 'Lib\10.0.26100.0\km\x64\ntoskrnl.lib')) {
              if (!(Test-Path (Join-Path $kitRoot $relative))) { throw "Missing SDK/WDK file: $relative" }
            }
          } finally { Stop-Transcript }
      - name: Verify driver toolset after kit installation
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath
          $toolsets = Get-ChildItem "$vs\MSBuild\Microsoft\VC" -Recurse -Filter Toolset.props |
            Where-Object { $_.FullName -match 'WindowsKernelModeDriver10.0' }
          $toolsets.FullName | Out-File build-logs/wdk-toolsets.txt
          if (!$toolsets) { throw 'WindowsKernelModeDriver10.0 integration missing after setup' }
      - name: Compile source prototypes only
        shell: pwsh
        run: |
          msbuild sof_windows_driver.sln /m /t:Rebuild /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:TargetPlatformVersion=10.0.26100.0 /p:WindowsTargetPlatformVersion=10.0.26100.0 /v:normal /bl:build-logs/msbuild.binlog /fl '/flp:LogFile=build-logs/msbuild.log;Verbosity=normal'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile guarded source to isolated objects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($case in @(
            @{ Project='sof_dsp'; Defines='/DPUJJO_ENABLE_EXPERIMENTAL_DSP_BOOT /DPUJJO_EXPLICIT_IPC4_FIRMWARE_REVIEWED /DPUJJO_ENABLE_EXPERIMENTAL_AUDIO' },
            @{ Project='pujjo_rt5682_probe'; Defines='/DPJ5682S_ENABLE_READONLY_PROBE' }
          )) {
            $env:CL = $case.Defines
            $objects = Join-Path $env:RUNNER_TEMP ("compile-only-" + $case.Project)
            msbuild "$($case.Project).vcxproj" /t:ClCompile /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 "/p:IntDir=$objects/" /p:TargetPlatformVersion=10.0.26100.0 /p:WindowsTargetPlatformVersion=10.0.26100.0 /v:minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $expected = if ($case.Project -eq 'sof_dsp') { 'Loader.obj' } else { 'PujjoPeripheralKmdf.obj' }
            if (!(Get-ChildItem $objects -Filter $expected -Recurse)) { throw "Missing compile-only object $expected" }
            if ($case.Project -eq 'sof_dsp') {
              foreach ($object in @('PujjoAudioBus.obj', 'WaveRt.obj')) {
                if (!(Get-ChildItem $objects -Filter $object -Recurse)) { throw "Missing guarded object $object" }
              }
            }
          }
      - name: Verify all expected unsigned development products
        shell: pwsh
        run: |
          $output = 'bin/x64/${{ matrix.configuration }}'
          foreach ($name in @('sof_core.lib', 'sof_dsp.sys', 'pujjo_audio.sys', 'pujjo_rt5682_probe.sys', 'pujjo_rt1019_probe.sys')) {
            $file = Join-Path $output $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing build product: $file" }
            Get-FileHash $file -Algorithm SHA256 | Format-List | Out-File build-logs/products.txt -Append
            if ($file.EndsWith('.sys')) {
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne 'NotSigned') { throw "Expected unsigned development binary: $file" }
            }
          }
          'NOT INSTALLABLE - NOT HARDWARE VERIFIED. Unsigned compile-only development products.' | Set-Content "$output/NOT-INSTALLABLE.txt"
      - name: Verify read-only diagnostic INFs and generate unsigned catalogs
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          ./scripts/Stage-PujjoDiagnosticPackage.ps1 -BinaryDirectory bin/x64/Release -OutputDirectory "$env:RUNNER_TEMP/pujjo-diagnostics" -SourceRevision $revision
      - name: Upload unsigned diagnostic submission input
        if: success() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Pujjo-resource-diagnostics-UNSIGNED-SUBMISSION
          path: ${{ runner.temp }}/pujjo-diagnostics/
          if-no-files-found: error
      - name: Preserve logs even when checks or compilation fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pujjo-${{ matrix.configuration }}-logs
          path: build-logs/
          if-no-files-found: warn
      - name: Upload successful intermediate products; NEVER install
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pujjo-${{ matrix.configuration }}-NOT-INSTALLABLE-NOT-HARDWARE-VERIFIED
          path: |
            bin/x64/${{ matrix.configuration }}/NOT-INSTALLABLE.txt
            bin/x64/${{ matrix.configuration }}/**/*.sys
            bin/x64/${{ matrix.configuration }}/**/*.lib
            bin/x64/${{ matrix.configuration }}/**/*.pdb
          if-no-files-found: error
